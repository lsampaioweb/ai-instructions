<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en_US">

<head>
  <title>Resource List</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
  <h1 th:text="${title}">Title</h1>
  <ul>
    <li th:each="item : ${items}" th:text="${item.name}">item name</li>
  </ul>
</body>

</html>
